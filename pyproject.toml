[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearsift"
version = "0.1.0"
description = "Halal stock screener and portfolio analyser for Trading 212"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
]

[project.scripts]
clearsift = "clearsift.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clearsift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
