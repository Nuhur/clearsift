# Clearsift screening settings.
# Defaults follow the AAOIFI standard.

screening:
  # standard: doubtful businesses pass, with a warning to check them by hand.
  # strict: only "Compliant" passes, doubtful is excluded.
  # Missing or stale data is excluded in both.
  mode: standard
  # Exclude a stock if its data is missing or stale (fail closed).
  fail_closed: true
  # Days before cached financial data counts as stale.
  max_data_age_days: 120
  # Market cap moves daily, so it goes stale much sooner than the rest.
  market_cap_max_age_days: 1
  # Some companies stop reporting interest income. Use the newest year that has it,
  # as long as it's no more than this many years before the latest report.
  max_interest_income_age_years: 3

  # Which standard to screen with. Must be one of the names under methodologies.
  # `clearsift screen --compare` runs all of them.
  methodology: aaoifi

  # Limits for each standard. Every ratio must be strictly below its limit.
  # A limit of 0.0 means zero tolerance (only exactly 0 passes).
  #   denominator: what debt, cash and receivables are divided by
  #                (market_cap or total_assets).
  #   max_debt: interest-bearing debt.
  #   max_cash: cash + interest-bearing investments.
  #   max_receivables_and_cash: accounts receivable + cash. null = not checked.
  #   max_impermissible_income: interest income / revenue from the same year.
  methodologies:
    aaoifi:
      denominator: market_cap
      max_debt: 0.30
      max_cash: 0.30
      max_receivables_and_cash: null
      max_impermissible_income: 0.05
    ftse:
      denominator: total_assets
      max_debt: 0.33333
      max_cash: 0.33333
      max_receivables_and_cash: 0.50
      max_impermissible_income: 0.05
    msci:
      denominator: total_assets
      max_debt: 0.3333
      max_cash: 0.3333
      max_receivables_and_cash: 0.3333
      max_impermissible_income: 0.05

  excluded_sectors:
    - conventional_banking
    - conventional_insurance
    - lending
    - alcohol
    - pork
    - tobacco
    - gambling
    - adult_entertainment
    - weapons_and_defence

  # Tickers to exclude whatever their industry says. Uppercase, e.g. "ABC" or "VOD.L".
  always_exclude_tickers: []

benchmark:
  # Halal benchmark used for every comparison.
  ticker: null  # set once you've chosen an Islamic index ETF
