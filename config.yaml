# Clearsift screening settings.
# Defaults follow the AAOIFI standard, with stricter rules on top.

screening:
  # strict: only "Compliant" passes; anything uncertain is excluded.
  mode: strict
  # Exclude a stock if its data is missing or stale (fail closed).
  fail_closed: true
  # Days before cached financial data counts as stale.
  max_data_age_days: 120
  # Market cap moves daily, so it goes stale much sooner than the rest.
  market_cap_max_age_days: 1

  ratios:
    # Interest-bearing debt / market cap must be below this.
    max_debt_to_market_cap: 0.30
    # Cash + interest-bearing investments / market cap must be below this.
    max_cash_to_market_cap: 0.30
    # Impermissible income / total revenue. 0.0 = zero tolerance.
    # Set to 0.05 for the AAOIFI limit (then enable purification).
    max_impermissible_income: 0.0

  excluded_sectors:
    - conventional_banking
    - conventional_insurance
    - lending
    - alcohol
    - pork
    - tobacco
    - gambling
    - adult_entertainment
    - weapons_and_defence

  # Tickers to exclude whatever their industry says. Uppercase, e.g. "ABC" or "VOD.L".
  always_exclude_tickers: []

benchmark:
  # Halal benchmark used for every comparison.
  ticker: null  # set once you've chosen an Islamic index ETF
